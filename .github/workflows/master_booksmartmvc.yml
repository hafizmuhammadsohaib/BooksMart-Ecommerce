name: Build and Deploy ASP.NET Core Web App - BooksMartMVC

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BooksMart.slnx

      - name: Build solution
        run: dotnet build BooksMart.slnx -c Release --no-restore

      - name: Publish Web Project
        run: dotnet publish BooksMart.Web/BooksMart.Web.csproj -c Release -o ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: BooksMartMVC
          package: ./publish/
