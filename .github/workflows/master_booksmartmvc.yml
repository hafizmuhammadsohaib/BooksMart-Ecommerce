name: Build and Deploy ASP.NET Core Web App - BooksMartMVC

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore all projects in the solution
      - name: Restore dependencies
        run: dotnet restore BooksMart.slnx

      # 4️⃣ Build solution
      - name: Build solution
        run: dotnet build BooksMart.slnx -c Release --no-restore

      # 5️⃣ Publish the web project (N-tier web project)
      - name: Publish Web Project
        working-directory: ./BookMart.Web
        run: dotnet publish BooksMart.Web.csproj -c Release -o publish

      # 6️⃣ List publish folder contents (optional, helps debug DLL and web.config)
      - name: List published files
        working-directory: ./BookMart.Web
        run: dir publish

      # 7️⃣ Azure login using service principal (ensure AZURE_CREDENTIALS secret exists)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 8️⃣ Deploy the publish folder to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: BooksMartMVC
          package: ./BookMart.Web/publish
