name: Build and Deploy ASP.NET Core Web App - BooksMartMVC

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore all projects in the solution
      - name: Restore dependencies
        run: dotnet restore BooksMart.slnx

      # 4️⃣ Build solution
      - name: Build solution
        run: dotnet build BooksMart.slnx -c Release --no-restore

      # 5️⃣ Publish the web project only
      - name: Publish Web Project
        run: dotnet publish BookMart.Web/BookMart.Web.csproj -c Release -o BookMart.Web/publish

      # 6️⃣ Azure login using Service Principal creds
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 7️⃣ Deploy the publish folder to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: BooksMartMVC
          package: BookMart.Web/publish
